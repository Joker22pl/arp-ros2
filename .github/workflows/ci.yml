name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-markdown:
    name: Lint markdown (ADR + reviews)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            *.md
            adr/*.md
            00_inbox/*.md
            02_system_architecture/**/*.md
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-links:
    name: Check links in markdown
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          args: --verbose --no-progress --accept=200,403 'adr/**/*.md' '00_inbox/**/*.md'
